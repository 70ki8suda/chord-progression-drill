<script type="application/json" id="cowork-artifact-meta">

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コード進行ドリル</title>
<style>
:root{color-scheme:light;
--bg:#f6f7fb;--card:#ffffff;--card2:#eef0f6;--tx:#1c1e26;--tx2:#5b6070;--acc:#4053c8;--acc2:#0a8f6a;--warn:#c2551a;--pink:#b03a8c;--bd:#dcdfe8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--tx);font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;line-height:1.6;padding-bottom:40px;}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:14px 18px;position:sticky;top:0;z-index:10;}
h1{font-size:17px;font-weight:700;}
h1 span{color:var(--acc);font-size:12px;margin-left:8px;font-weight:400;}
nav{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
nav button{background:var(--card2);color:var(--tx2);border:1px solid var(--bd);border-radius:20px;padding:5px 14px;font-size:12.5px;cursor:pointer;}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc);}
main{max-width:760px;margin:0 auto;padding:16px;}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px;}
.card h2{font-size:15px;margin-bottom:4px;}
.card h2 .badge{font-size:10.5px;background:var(--card2);color:var(--tx2);border-radius:10px;padding:2px 8px;margin-left:8px;font-weight:400;vertical-align:middle;}
.meta{font-size:11.5px;color:var(--tx2);margin-bottom:8px;}
.tags{margin-bottom:8px;}
.tag{display:inline-block;font-size:10.5px;border-radius:9px;padding:1.5px 8px;margin-right:5px;margin-bottom:3px;}
.tag.t1{background:#e3e7fb;color:var(--acc);}
.tag.t2{background:#dcf3ec;color:var(--acc2);}
.tag.t3{background:#fbe9df;color:var(--warn);}
.tag.t4{background:#f7e3f0;color:var(--pink);}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;}
.chip{background:var(--card2);border:1px solid var(--bd);border-radius:8px;padding:6px 11px;font-size:14px;font-weight:600;cursor:pointer;user-select:none;}
.chip:hover{border-color:var(--acc);}
.chip small{display:block;font-size:9.5px;color:var(--tx2);font-weight:400;text-align:center;}
.desc{font-size:12.5px;color:var(--tx2);background:var(--card2);border-radius:8px;padding:10px 12px;margin-top:8px;}
.desc b{color:var(--tx);}
.ctr{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap;}
.pbtn{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:7px 16px;font-size:12.5px;cursor:pointer;}
.nbtn{background:var(--card);color:var(--acc);border:1px solid var(--acc);border-radius:8px;padding:6px 14px;font-size:12.5px;cursor:pointer;}
.notes{font-size:11px;color:var(--tx2);min-height:16px;flex:1;}
.nb{display:none;margin-top:12px;border-top:1px dashed var(--bd);padding-top:12px;}
.nb.open{display:block;}
.nbgrid{display:flex;gap:10px;flex-wrap:wrap;}
.nbitem{background:var(--card2);border-radius:10px;padding:8px;text-align:center;min-width:180px;}
.nbitem .nm{font-size:12.5px;font-weight:700;margin-bottom:2px;}
.nbitem .nn{font-size:9.5px;color:var(--tx2);margin-top:2px;line-height:1.4;}
.vexstaff,.vextab{display:flex;justify-content:center;overflow:visible;}
.vexstaff svg,.vextab svg{display:block;max-width:100%;height:auto;overflow:visible;}
.tabwrap{display:flex;gap:8px;justify-content:center;align-items:flex-start;flex-wrap:wrap;}
.nbitem > svg text,.tabwrap > svg text{font-family:system-ui;}
select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font-size:13px;max-width:100%;}
.qbox{text-align:center;padding:8px 0;}
.qq{font-size:15px;font-weight:600;margin-bottom:14px;}
.qopts{display:flex;flex-direction:column;gap:8px;max-width:420px;margin:0 auto;}
.qopts button{background:var(--card2);border:1px solid var(--bd);border-radius:8px;padding:10px;font-size:13.5px;cursor:pointer;color:var(--tx);}
.qopts button.ok{background:#dcf3ec;border-color:var(--acc2);}
.qopts button.ng{background:#fbe3e3;border-color:#c04040;}
.qnext{margin-top:14px;}
.qscore{font-size:12px;color:var(--tx2);margin-top:10px;}
.hint{font-size:11.5px;color:var(--tx2);margin:2px 0 10px;}
</style>

<body>
<header>
<h1>コード進行ドリル<span id="dateLabel"></span></h1>
<nav>
<button data-tab="songs" class="on">今日の実曲</button>
<button data-tab="daily">基礎ドリル</button>
<button data-tab="quiz">クイズ</button>
<button data-tab="ref">リファレンス</button>
</nav>
</header>
<main id="main"></main>
<script src="https://unpkg.com/vexflow@5.0.0/build/cjs/vexflow.js"></script>
<script>
"use strict";
/* ============ 基礎データ ============ */
const FLAT=["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"];
const SHARP=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const KEYS=[
{n:"C",s:0,f:false},{n:"D♭",s:1,f:true},{n:"D",s:2,f:false},{n:"E♭",s:3,f:true},
{n:"E",s:4,f:false},{n:"F",s:5,f:true},{n:"G♭",s:6,f:true},{n:"G",s:7,f:false},
{n:"A♭",s:8,f:true},{n:"A",s:9,f:false},{n:"B♭",s:10,f:true},{n:"B",s:11,f:false}];
const TYPES={
"":{sfx:"",iv:[0,4,7]},
"m":{sfx:"m",iv:[0,3,7]},
"M7":{sfx:"△7",iv:[0,4,7,11]},
"m7":{sfx:"m7",iv:[0,3,7,10]},
"7":{sfx:"7",iv:[0,4,7,10]},
"m7b5":{sfx:"m7(♭5)",iv:[0,3,6,10]},
"M7_9":{sfx:"△7(9)",iv:[0,4,7,11,14]},
"m7_9":{sfx:"m7(9)",iv:[0,3,7,10,14]},
"7_913":{sfx:"7(9,13)",iv:[0,4,10,14,21]},
"7_b9b13":{sfx:"7(♭9,♭13)",iv:[0,4,10,13,20]},
"7_s11":{sfx:"7(#11)",iv:[0,4,10,18]},
"7_b9":{sfx:"7(♭9)",iv:[0,4,7,10,13]},
"9":{sfx:"9",iv:[0,4,7,10,14]},
"7sus4":{sfx:"7sus4",iv:[0,5,7,10,14]},
"dim7":{sfx:"dim7",iv:[0,3,6,9]},
"6":{sfx:"6",iv:[0,4,7,9]}
};
function cname(key,ch){const pc=(key.s+ch.d)%12;return (key.f?FLAT[pc]:SHARP[pc])+TYPES[ch.t].sfx;}

/* ============ ボイスリーディング ============ */
const RHP={
"":[0,4,7],"m":[0,3,7],"M7":[4,7,11],"m7":[3,7,10],"7":[4,7,10],
"m7b5":[3,6,10],"M7_9":[4,11,2],"m7_9":[3,10,2],
"7_913":[4,10,2,9],"7_b9b13":[4,10,1,8],"7_s11":[4,6,10],"7_b9":[4,10,1],
"9":[4,10,2],"7sus4":[5,10,2],"dim7":[0,3,6,9],"6":[4,7,9]};
function leadRH(pcs,prev){
 let best=null,bestScore=1e9;
 for(let s=0;s<pcs.length;s++){
  const order=pcs.slice(s).concat(pcs.slice(0,s));
  for(let anchor=55;anchor<=67;anchor++){
   if(anchor%12!==order[0]%12)continue;
   const notes=[anchor];
   for(let i=1;i<order.length;i++){
    let n=notes[i-1]+((order[i]-order[i-1]+12)%12||12);
    notes.push(n);
   }
   if(notes[notes.length-1]>81)continue;
   const avg=notes.reduce((a,b)=>a+b,0)/notes.length;
   let score;
   if(prev){
    const pavg=prev.reduce((a,b)=>a+b,0)/prev.length;
    score=2*Math.abs(avg-pavg)+Math.abs(notes[notes.length-1]-prev[prev.length-1]);
   }else{score=Math.abs(avg-66);}
   if(notes[notes.length-1]-notes[0]>14)score+=4;
   if(score<bestScore){bestScore=score;best=notes;}
  }
 }
 return best;
}
function progVoicings(key,chs){
 const out=[];let prev=null;
 for(const ch of chs){
  const rootpc=(key.s+ch.d)%12;
  const pcs=RHP[ch.t].map(x=>(rootpc+x)%12);
  const rh=leadRH(pcs,prev);prev=rh;
  const bass=38+((rootpc-2+12)%12);
  const lh=[bass];
  if(TYPES[ch.t].iv.length>=4&&TYPES[ch.t].iv.includes(7)&&bass<=43)lh.push(bass+7);
  out.push({lh,rh});
 }
 return out;
}

/* ============ 音名スペリング ============ */
const LETTERS_F={0:["C",0],1:["D",-1],2:["D",0],3:["E",-1],4:["E",0],5:["F",0],6:["G",-1],7:["G",0],8:["A",-1],9:["A",0],10:["B",-1],11:["B",0]};
const LETTERS_S={0:["C",0],1:["C",1],2:["D",0],3:["D",1],4:["E",0],5:["F",0],6:["F",1],7:["G",0],8:["G",1],9:["A",0],10:["A",1],11:["B",0]};
const LIDX={C:0,D:1,E:2,F:3,G:4,A:5,B:6};
function spell(key,m){
 const pc=m%12,oct=Math.floor(m/12)-1;
 const [L,acc]=(key.f?LETTERS_F:LETTERS_S)[pc];
 const dia=oct*7+LIDX[L];
 const nm=L+(acc===1?"#":acc===-1?"♭":"")+oct;
 return {m,nm,acc,dia};
}

/* ============ 五線譜SVG ============ */
function fallbackStaffNotesSVG(key,lh,rh){
 const W=150;
 let s=`<svg width="${W}" height="185" viewBox="0 0 ${W} 185" xmlns="http://www.w3.org/2000/svg">`;
 for(let i=0;i<5;i++){s+=`<line x1="8" y1="${40+i*10}" x2="${W-8}" y2="${40+i*10}" stroke="#888" stroke-width="1"/>`;
  s+=`<line x1="8" y1="${110+i*10}" x2="${W-8}" y2="${110+i*10}" stroke="#888" stroke-width="1"/>`;}
 s+=`<text x="10" y="68" font-size="34" fill="#555">\u{1D11E}</text>`;
 s+=`<text x="10" y="128" font-size="26" fill="#555">\u{1D122}</text>`;
 const yT=d=>80-(d-30)*5, yB=d=>150-(d-18)*5;
 const drawNotes=(notes,yOf,cx)=>{
  const sp=notes.map(m=>spell(key,m));
  let prevDia=null,off=0;
  sp.forEach(o=>{
   const y=yOf(o.dia);
   off=(prevDia!==null&&o.dia-prevDia===1)?(off===0?13:0):0;
   const x=cx+off;
   if(yOf===yT){
    for(let d=30-2;d>=o.dia;d-=2){const ly=80-(d-30)*5;if(ly>82)s+=`<line x1="${x-9}" y1="${ly}" x2="${x+9}" y2="${ly}" stroke="#888"/>`;}
    for(let d=30+10;d<=o.dia;d+=2){const ly=80-(d-30)*5;if(ly<38)s+=`<line x1="${x-9}" y1="${ly}" x2="${x+9}" y2="${ly}" stroke="#888"/>`;}
   }else{
    for(let d=18-2;d>=o.dia;d-=2){const ly=150-(d-18)*5;if(ly>152)s+=`<line x1="${x-9}" y1="${ly}" x2="${x+9}" y2="${ly}" stroke="#888"/>`;}
    for(let d=18+10;d<=o.dia;d+=2){const ly=150-(d-18)*5;if(ly<108)s+=`<line x1="${x-9}" y1="${ly}" x2="${x+9}" y2="${ly}" stroke="#888"/>`;}
   }
   s+=`<ellipse cx="${x}" cy="${y}" rx="6.5" ry="4.8" fill="#1c1e26" transform="rotate(-15 ${x} ${y})"/>`;
   if(o.acc===1)s+=`<text x="${x-17}" y="${y+4}" font-size="12" fill="#1c1e26">#</text>`;
   if(o.acc===-1)s+=`<text x="${x-17}" y="${y+4}" font-size="13" fill="#1c1e26">♭</text>`;
   prevDia=o.dia;
  });
 };
 drawNotes(rh,yT,88);
 drawNotes(lh,yB,88);
 s+="</svg>";
 return s;
}
function vexFlow(){
 return window.VexFlow||null;
}
function vexKey(o){
 const oct=Math.floor(o.m/12)-1;
 const acc=o.acc===1?"#":o.acc===-1?"b":"";
 return o.nm[0].toLowerCase()+acc+"/"+oct;
}
function vexAccidental(o){
 return o.acc===1?"#":o.acc===-1?"b":null;
}
function addVexAccidentals(note,spelled){
 const VF=vexFlow();
 if(!VF)return;
 spelled.forEach((o,i)=>{
  const acc=vexAccidental(o);
  if(acc)note.addModifier(new VF.Accidental(acc),i);
 });
}
function renderVexPianoStaff(key,lh,rh){
 const VF=vexFlow();
 if(!VF||!document)return fallbackStaffNotesSVG(key,lh,rh);
 try{
  const W=178,H=188,div=document.createElement("div");
  div.className="vexstaff";
  const renderer=new VF.Renderer(div,VF.Renderer.Backends.SVG);
  renderer.resize(W,H);
  const ctx=renderer.getContext();
  ctx.setFont("Arial",10);
  const treble=new VF.Stave(8,8,W-16).addClef("treble");
  const bass=new VF.Stave(8,88,W-16).addClef("bass");
  treble.setContext(ctx).draw();
  bass.setContext(ctx).draw();
  if(VF.StaveConnector){
   new VF.StaveConnector(treble,bass).setType(VF.StaveConnector.type.BRACE).setContext(ctx).draw();
   new VF.StaveConnector(treble,bass).setType(VF.StaveConnector.type.SINGLE_LEFT).setContext(ctx).draw();
  }
  const rhSp=rh.map(m=>spell(key,m));
  const lhSp=lh.map(m=>spell(key,m));
  const rhNote=new VF.StaveNote({clef:"treble",keys:rhSp.map(vexKey),duration:"q"});
  const lhNote=new VF.StaveNote({clef:"bass",keys:lhSp.map(vexKey),duration:"q"});
  addVexAccidentals(rhNote,rhSp);
  addVexAccidentals(lhNote,lhSp);
  VF.Formatter.FormatAndDraw(ctx,treble,[rhNote],{auto_beam:false});
  VF.Formatter.FormatAndDraw(ctx,bass,[lhNote],{auto_beam:false});
  return div.outerHTML;
 }catch(err){
  console.warn("VexFlow piano render failed",err);
  return fallbackStaffNotesSVG(key,lh,rh);
 }
}

/* ============ ギター ============ */
const GTR={
"":[{s:6,rel:[0,2,2,1,0,0]},{s:5,rel:["x",0,2,2,2,0]}],
"m":[{s:6,rel:[0,2,2,0,0,0]},{s:5,rel:["x",0,2,2,1,0]}],
"M7":[{s:6,rel:[0,"x",1,1,0,"x"]},{s:5,rel:["x",0,2,1,2,"x"]}],
"m7":[{s:6,rel:[0,"x",0,0,0,"x"]},{s:5,rel:["x",0,2,0,1,"x"]}],
"7":[{s:6,rel:[0,"x",0,1,0,"x"]},{s:5,rel:["x",0,2,0,2,"x"]}],
"m7b5":[{s:5,rel:["x",0,1,0,1,"x"]}],
"M7_9":[{s:5,rel:["x",0,-1,1,0,"x"]}],
"m7_9":[{s:6,rel:[0,"x",0,0,0,2]}],
"7_913":[{s:6,rel:[0,"x",0,1,2,2]}],
"7_b9b13":[{s:5,rel:["x",0,-1,0,-1,"x"]}],
"7_s11":[{s:6,rel:[0,"x",0,1,-1,"x"]}],
"7_b9":[{s:5,rel:["x",0,-1,0,-1,"x"]},{s:6,rel:[0,"x",0,1,0,1]}],
"9":[{s:5,rel:["x",0,-1,0,0,0]},{s:6,rel:[0,"x",0,1,0,2]}],
"7sus4":[{s:6,rel:[0,"x",0,2,0,"x"]},{s:5,rel:["x",0,2,0,3,"x"]}],
"dim7":[{s:5,rel:["x",0,1,-1,1,"x"]},{s:6,rel:[0,"x",-1,0,-1,"x"]}],
"6":[{s:5,rel:["x",0,2,2,2,2]}]
};
function shapeFret(pc,sh){
 let f=sh.s===6?(pc-4+12)%12:(pc-9+12)%12;
 if(f===0){
  const hasNeg=sh.rel.some(r=>r!=="x"&&r<0);
  f=hasNeg?12:0;
 }
 return f;
}
function guitarFor(pc,t,prevF){
 const opts=GTR[t];let best=null,bs=1e9;
 for(const sh of opts){
  const f=shapeFret(pc,sh);
  let sc=prevF===null?Math.abs(f-3):Math.abs(f-prevF);
  if(f>9)sc+=6;
  if(sc<bs){bs=sc;best={sh,f};}
 }
 return best;
}
function fallbackGuitarSVG(name,sh,f){
 const rel=sh.rel;
 const frets=rel.filter(r=>r!=="x").map(r=>f+r);
 const played=frets.filter(x=>x>0);
 const maxF=played.length?Math.max(...played):0;
 const minF=played.length?Math.min(...played):0;
 let base;
 if(maxF<=4||frets.some(x=>x===0)){base=1;}else{base=minF;}
 const rows=Math.max(4,maxF-base+1);
 const sw=13,fh=15,x0=18,y0=26;
 const W=x0+sw*5+16,H=y0+fh*rows+14;
 let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
 for(let i=0;i<6;i++)s+=`<line x1="${x0+i*sw}" y1="${y0}" x2="${x0+i*sw}" y2="${y0+fh*rows}" stroke="#888"/>`;
 for(let i=0;i<=rows;i++)s+=`<line x1="${x0}" y1="${y0+i*fh}" x2="${x0+5*sw}" y2="${y0+i*fh}" stroke="#888" stroke-width="${i===0&&base===1?3:1}"/>`;
 if(base>1)s+=`<text x="${x0+5*sw+3}" y="${y0+fh-4}" font-size="9" fill="#5b6070">${base}fr</text>`;
 rel.forEach((r,i)=>{
  const x=x0+i*sw;
  if(r==="x"){s+=`<text x="${x-4}" y="${y0-6}" font-size="10" fill="#5b6070">×</text>`;return;}
  const fr=f+r;
  if(fr===0){s+=`<circle cx="${x}" cy="${y0-9}" r="4" fill="none" stroke="#1c1e26"/>`;return;}
  const row=fr-base;
  const cy=y0+row*fh+fh/2;
  const isRoot=(sh.s===6&&i===0)||(sh.s===5&&i===1);
  s+=`<circle cx="${x}" cy="${cy}" r="5" fill="${isRoot?'#4053c8':'#1c1e26'}"/>`;
 });
 s+="</svg>";
 return s;
}
function tabPositions(sh,f){
 const pos=[];
 sh.rel.forEach((r,i)=>{
  if(r==="x")return;
  pos.push({str:String(6-i),fret:String(f+r)});
 });
 return pos;
}
function renderVexGuitarTab(name,sh,f){
 const VF=vexFlow();
 if(!VF||!document)return "";
 try{
  const W=178,H=132,div=document.createElement("div");
  div.className="vextab";
  const renderer=new VF.Renderer(div,VF.Renderer.Backends.SVG);
  renderer.resize(W,H);
  const ctx=renderer.getContext();
  ctx.setFont("Arial",10);
  const stave=new VF.TabStave(8,8,W-16).addTabGlyph();
  stave.setContext(ctx).draw();
  const positions=tabPositions(sh,f);
  if(!positions.length)return "";
  const note=new VF.TabNote({positions,duration:"q"});
  VF.Formatter.FormatAndDraw(ctx,stave,[note],{auto_beam:false});
  return div.outerHTML;
 }catch(err){
  console.warn("VexFlow tab render failed",err);
  return "";
 }
}

/* ============ 譜面パネル ============ */
function notationHTML(key,chs,voiced){
 let h='<div class="nbgrid">';
 let prevF=null;
 chs.forEach((ch,i)=>{
  const pc=(key.s+ch.d)%12;
  const v=voiced[i];
  const g=guitarFor(pc,ch.t,prevF);prevF=g.f;
  const lhN=v.lh.map(m=>spell(key,m).nm).join(" ");
  const rhN=v.rh.map(m=>spell(key,m).nm).join(" ");
  const name=cname(key,ch);
  const tab=renderVexGuitarTab(name,g.sh,g.f);
  h+=`<div class="nbitem"><div class="nm">${cname(key,ch)}</div>`
   +renderVexPianoStaff(key,v.lh,v.rh)
   +`<div class="tabwrap">${tab}${fallbackGuitarSVG(name,g.sh,g.f)}</div>`
   +`<div class="nn">左: ${lhN}<br>右: ${rhN}</div></div>`;
 });
 h+="</div>";
 return h;
}

/* ============ 再生 ============ */
let AC=null;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function playNotes(midis,t0,dur){
 const c=ac();
 midis.forEach(m=>{
  const o=c.createOscillator(),g=c.createGain();
  o.type="triangle";o.frequency.value=440*Math.pow(2,(m-69)/12);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(0.14/Math.sqrt(midis.length),t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g).connect(c.destination);
  o.start(t0);o.stop(t0+dur+0.05);
 });
}
function playChord(notes){const c=ac();if(c.state==="suspended")c.resume();playNotes(notes,c.currentTime+0.03,1.4);}
function playProg(voiced){
 const c=ac();if(c.state==="suspended")c.resume();
 const t0=c.currentTime+0.05;
 voiced.forEach((v,i)=>playNotes(v.lh.concat(v.rh),t0+i*1.1,1.05));
}

/* ============ 日替わり ============ */
const today=new Date();
const seed=today.getFullYear()*10000+(today.getMonth()+1)*100+today.getDate();
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rng=mulberry32(seed);
const dayKey=KEYS[Math.floor(rng()*12)];
document.getElementById("dateLabel").textContent=`${today.getMonth()+1}/${today.getDate()} ・ 今日のキー: ${dayKey.n}`;
const WD_THEMES={1:"teiban",2:"sec",3:"ura",4:"tension",5:"mix",6:"mix",0:"mix"};

/* ============ レジストリ+委譲 ============ */
let REG={},CID=0;
function reg(o){const id="r"+(CID++);REG[id]=o;return id;}
function controlsHTML(id){
 return `<div class="ctr"><button class="pbtn" data-pid="${id}">▶ 進行を再生</button>`
  +`<button class="nbtn" data-nb="${id}">🎼 五線譜・ギター</button>`
  +`<span class="notes" id="no_${id}"></span></div>`
  +`<div class="nb" id="nb_${id}"></div>`;
}
function chipsHTML(key,chs,voiced){
 let h='<div class="chips">';
 chs.forEach((ch,i)=>{
  const cid=reg({key,ch,notes:voiced?voiced[i].lh.concat(voiced[i].rh):null});
  h+=`<div class="chip" data-cid="${cid}">${cname(key,ch)}<small>${ch.r||""}</small></div>`;
 });
 h+="</div>";
 return h;
}
document.getElementById("main").addEventListener("click",e=>{
 const chip=e.target.closest("[data-cid]");
 if(chip){
  const o=REG[chip.dataset.cid];
  let notes=o.notes;
  if(!notes){const v=progVoicings(o.key,[o.ch])[0];notes=v.lh.concat(v.rh);}
  playChord(notes);
  const card=chip.closest(".card");
  const no=card&&card.querySelector(".notes");
  if(no)no.textContent=cname(o.key,o.ch)+": "+notes.map(m=>spell(o.key,m).nm).join(" ");
  return;
 }
 const pb=e.target.closest("[data-pid]");
 if(pb){const o=REG[pb.dataset.pid];playProg(o.voiced);return;}
 const nb=e.target.closest("[data-nb]");
 if(nb){
  const id=nb.dataset.nb,panel=document.getElementById("nb_"+id);
  if(!panel.dataset.done){const o=REG[id];panel.innerHTML=notationHTML(o.key,o.chs,o.voiced);panel.dataset.done="1";}
  panel.classList.toggle("open");
 }
});

/* ============ カード描画 ============ */
function songCard(song,open){
 const key=song.key;
 const voiced=progVoicings(key,song.chs);
 const id=reg({key,chs:song.chs,voiced});
 let h=`<div class="card"><h2>${song.title}<span class="badge">${song.artist}</span></h2>`;
 h+=`<div class="meta">キー: ${key.n} ／ ${song.section}</div>`;
 h+=`<div class="tags">${song.tags.map(t=>`<span class="tag ${t[0]}">${t[1]}</span>`).join("")}</div>`;
 h+=chipsHTML(key,song.chs,voiced);
 h+=`<div class="desc">${song.comment}</div>`;
 h+=controlsHTML(id);
 h+="</div>";
 if(open)setTimeout(()=>{
  const panel=document.getElementById("nb_"+id);
  if(panel&&!panel.dataset.done){const o=REG[id];panel.innerHTML=notationHTML(o.key,o.chs,o.voiced);panel.dataset.done="1";panel.classList.add("open");}
 },0);
 return h;
}
function progCard(p,key){
 const voiced=progVoicings(key,p.chs);
 const id=reg({key,chs:p.chs,voiced});
 let h=`<div class="card"><h2>${p.name}</h2>`;
 h+=`<div class="tags"><span class="tag ${p.tag[0]}">${p.tag[1]}</span><span class="tag t2">キー: ${key.n}</span></div>`;
 h+=chipsHTML(key,p.chs,voiced);
 h+=`<div class="desc">${p.desc}</div>`;
 h+=controlsHTML(id);
 h+="</div>";
 return h;
}
function pairCard(name,tagCls,tagTxt,key,chs,desc){
 const voiced=progVoicings(key,chs);
 const id=reg({key,chs,voiced});
 let h=`<div class="card"><h2>${name}</h2>`;
 h+=`<div class="tags"><span class="tag ${tagCls}">${tagTxt}</span><span class="tag t2">キー: ${key.n}</span></div>`;
 h+=chipsHTML(key,chs,voiced);
 h+=`<div class="desc">${desc}</div>`;
 h+=controlsHTML(id);
 h+="</div>";
 return h;
}

 const s1=SONGS[(p*2)%SONGS.length],s2=SONGS[(p*2+1)%SONGS.length];
 let h=`<div class="hint">日替わり2曲。コードを1つずつ鳴らして響きを確認 → 進行を再生 → 譜面でピアノ(ボイスリーディング済み)とギターを弾く。慣れたら他のキーでも。</div>`;
 h+=songCard(s1,true);
 h+=songCard(s2,true);
 const opts=SONGS.map((s,i)=>`<option value="${i}">${s.title} (${s.artist})</option>`).join("");
 h+=`<div class="card"><h2>曲ライブラリ</h2><div class="hint">全${SONGS.length}曲から選んで練習</div>`
  +`<select id="songSel"><option value="">— 曲を選ぶ —</option>${opts}</select>`
  +`<div id="songOut"></div></div>`;
 document.getElementById("main").innerHTML=h;
 document.getElementById("songSel").addEventListener("change",e=>{
  const i=e.target.value;
  document.getElementById("songOut").innerHTML=i===""?"":songCard(SONGS[+i],true);
 });
}

 let h=`<div class="hint">今日のキー <b>${dayKey.n}</b> でパターンを体に入れる基礎練。</div>`;
 if(theme==="teiban"||theme==="mix"){
  const pick=theme==="mix"?[PROGS[Math.floor(rng()*PROGS.length)]]:PROGS.slice(0,4);
  pick.forEach(p=>h+=progCard(p,dayKey));
 }
 if(theme==="sec"||theme==="mix"){
  const list=theme==="mix"?[SECONDARY[Math.floor(rng()*SECONDARY.length)]]:SECONDARY;
  list.forEach(s=>{
   const chs=[{d:s.d,t:"7",r:s.name},{...s.to,r:s.toR}];
   h+=pairCard(`${s.name} (${s.orig}を7thに)`,"t2","セカンダリードミナント",dayKey,chs,`ダイアトニックの${s.orig}をドミナント7thにすると${s.toR}へ強く引っ張る。ルートは4度上行。`);
  });
 }
 if(theme==="ura"||theme==="mix"){
  const list=theme==="mix"?[URA[Math.floor(rng()*URA.length)]]:URA;
  list.forEach(u=>{
   const chs=[{d:u.d,t:"7",r:u.r},{...u.to,r:""}];
   h+=pairCard(u.name,"t3","裏コード",dayKey,chs,`${u.orig}の裏(トライトーン代理)。3rdと7thが共通で、ベースは半音下行して解決する。`);
  });
 }
 if(theme==="tension"||theme==="mix"){
  const list=theme==="mix"?[TENSIONS[Math.floor(rng()*TENSIONS.length)]]:TENSIONS;
  list.forEach(t=>{
   const chs=[{d:t.t.startsWith("m")?2:t.t.startsWith("M")?0:7,t:t.t,r:""}];
   h+=pairCard(t.name,"t4","テンション",dayKey,chs,t.use);
  });
 }
 document.getElementById("main").innerHTML=h;
}

/* ============ タブ: クイズ ============ */
const quiz={q:null,score:0,total:0};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeQuestion(){
 const cats=["teiban","sec","ura","tension"];
 const cat=cats[Math.floor(Math.random()*4)];
 const key=KEYS[Math.floor(Math.random()*12)];
 if(cat==="teiban"){
  const p=PROGS[Math.floor(Math.random()*PROGS.length)];
  const names=p.chs.map(c=>cname(key,c)).join(" → ");
  const opts=shuffle([p.name,...shuffle(PROGS.filter(x=>x.id!==p.id)).slice(0,3).map(x=>x.name)]);
  return {text:`キー${key.n}で「${names}」— これは何進行?`,opts,ans:p.name};
 }
 if(cat==="sec"){
  const s=SECONDARY[Math.floor(Math.random()*SECONDARY.length)];
  const c=cname(key,{d:s.d,t:"7"});
  const opts=shuffle(SECONDARY.map(x=>x.name)).slice(0,4);
  return {text:`キー${key.n}の ${c} はどのセカンダリードミナント?`,opts:opts.includes(s.name)?opts:[s.name,...opts.slice(0,3)],ans:s.name};
 }
 if(cat==="ura"){
  const u=URA[Math.floor(Math.random()*URA.length)];
  const correct=cname(key,{d:u.d,t:"7"})+" → "+cname(key,u.to);
  const wrongs=shuffle(URA.filter(x=>x!==u)).slice(0,3).map(w=>cname(key,{d:w.d,t:"7"})+" → "+cname(key,w.to));
  return {text:`キー${key.n}: ${u.name.split(" ")[0]}(度数: ${u.orig}の裏)にあたるのは?`,opts:shuffle([correct,...wrongs]),ans:correct};
 }
 const t=TENSIONS[Math.floor(Math.random()*TENSIONS.length)];
 const opts=shuffle(TENSIONS.map(x=>x.name)).slice(0,4);
 return {text:`「${t.use}」— この説明に合うコードは?`,opts:opts.includes(t.name)?opts:[t.name,...opts.slice(0,3)],ans:t.name};
}
function renderQuiz(){
 REG={};CID=0;
 quiz.q=makeQuestion();
 const m=document.getElementById("main");
 m.innerHTML=`<div class="card qbox"><div class="qq">${quiz.q.text}</div>
 <div class="qopts">${quiz.q.opts.map(o=>`<button data-qo="${o.replace(/"/g,'&quot;')}">${o}</button>`).join("")}</div>
 <div class="qnext"></div><div class="qscore">正解: ${quiz.score} / ${quiz.total}</div></div>`;
 m.querySelectorAll("[data-qo]").forEach(b=>b.addEventListener("click",()=>{
  if(quiz.q.done)return;quiz.q.done=true;quiz.total++;
  const ok=b.dataset.qo===quiz.q.ans;
  if(ok){quiz.score++;b.classList.add("ok");}
  else{b.classList.add("ng");m.querySelectorAll("[data-qo]").forEach(x=>{if(x.dataset.qo===quiz.q.ans)x.classList.add("ok");});}
  m.querySelector(".qscore").textContent=`正解: ${quiz.score} / ${quiz.total}`;
  m.querySelector(".qnext").innerHTML=`<button class="pbtn">次の問題 →</button>`;
  m.querySelector(".qnext .pbtn").addEventListener("click",renderQuiz);
 }));
}

/* ============ タブ: リファレンス ============ */
function renderRef(){
 REG={};CID=0;
 let h=`<div class="card"><h2>キー選択</h2><select id="refKey">${KEYS.map((k,i)=>`<option value="${i}" ${k.s===dayKey.s?"selected":""}>${k.n}</option>`).join("")}</select></div><div id="refBody"></div>`;
 document.getElementById("main").innerHTML=h;
 const body=document.getElementById("refBody");
 const draw=()=>{
  REG={};CID=0;
  const key=KEYS[+document.getElementById("refKey").value];
  let b="";
  PROGS.forEach(p=>b+=progCard(p,key));
  SECONDARY.forEach(s=>{
   const chs=[{d:s.d,t:"7",r:s.name},{...s.to,r:s.toR}];
   b+=pairCard(s.name,"t2","セカンダリードミナント",key,chs,`${s.orig}を7th化 → ${s.toR}へ解決`);
  });
  URA.forEach(u=>{
   const chs=[{d:u.d,t:"7",r:u.r},{...u.to,r:""}];
   b+=pairCard(u.name,"t3","裏コード",key,chs,`${u.orig}のトライトーン代理`);
  });
  TENSIONS.forEach(t=>{
   const chs=[{d:t.t.startsWith("m")?2:t.t.startsWith("M")?0:7,t:t.t,r:""}];
   b+=pairCard(t.name,"t4","テンション",key,chs,t.use);
  });
  body.innerHTML=b;
 };
 document.getElementById("refKey").addEventListener("change",draw);
 draw();
}

/* ============ ナビ ============ */
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{
 document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
 b.classList.add("on");
 ({songs:renderSongs,daily:renderDaily,quiz:renderQuiz,ref:renderRef})[b.dataset.tab]();
}));
renderSongs();
</script>
